    <path d="M292 146H348" fill="none" stroke="#58717c" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="640" y="114" text-anchor="middle" fill="#52646d" font-size="14">本机桥接</text>
    <path d="M612 146H668" fill="none" stroke="#58717c" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
