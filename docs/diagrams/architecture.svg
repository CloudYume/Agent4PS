    <text x="676" y="39" fill="#52646d" font-size="15" font-weight="700">本机进程</text>

    <rect x="36" y="57" width="248" height="158" rx="6" fill="#ffffff" stroke="#cfdbe0"/>
    <path d="M42 57H278" stroke="#c46b4b" stroke-width="4"/>
    <text x="58" y="108" fill="#1e3039" font-size="23" font-weight="700">LeetCode</text>
    <text x="58" y="149" fill="#435762" font-size="16">题面 · Python 模板</text>
    <text x="58" y="178" fill="#435762" font-size="16">运行与正式判题</text>

    <rect x="356" y="57" width="248" height="158" rx="6" fill="#ffffff" stroke="#c8dcd6"/>
    <path d="M362 57H598" stroke="#168878" stroke-width="4"/>
    <text x="378" y="108" fill="#1e3039" font-size="23" font-weight="700">Edge 扩展</text>
    <text x="378" y="149" fill="#435762" font-size="16">读取当前题目页</text>
    <text x="378" y="178" fill="#435762" font-size="16">写码 · 运行 · 提交</text>

    <rect x="676" y="57" width="248" height="158" rx="6" fill="#ffffff" stroke="#cbd8e3"/>
    <path d="M682 57H918" stroke="#426d9f" stroke-width="4"/>
