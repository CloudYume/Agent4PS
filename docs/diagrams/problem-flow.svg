<svg xmlns="http://www.w3.org/2000/svg" width="960" height="396" viewBox="0 0 960 396" role="img" aria-labelledby="title description">
  <title id="title">Agent4PS problem workflow</title>
  <desc id="description">Read a problem, generate or restore code, perform local and site checks, then submit and query the captured ID. Acceptance advances the cursor; failure triggers repair; an uncertain result preserves progress.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#61747e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="394" rx="6" fill="#fbfcfd" stroke="#dce5e8"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="35" y="41" fill="#243942" font-size="20" font-weight="700">Problem workflow</text>
    <text x="925" y="40" text-anchor="end" fill="#5b6d76" font-size="14">Completion requires a verified judge result</text>

    <g fill="#ffffff" stroke="#cbd8dd">
      <rect x="35" y="76" width="150" height="104" rx="6"/>
      <rect x="220" y="76" width="150" height="104" rx="6"/>
      <rect x="405" y="76" width="150" height="104" rx="6"/>
      <rect x="590" y="76" width="150" height="104" rx="6"/>
      <rect x="775" y="76" width="150" height="104" rx="6"/>
    </g>
    <g fill="#168878">
      <rect x="41" y="76" width="138" height="4"/>
      <rect x="226" y="76" width="138" height="4"/>
      <rect x="411" y="76" width="138" height="4"/>
      <rect x="596" y="76" width="138" height="4"/>
      <rect x="781" y="76" width="138" height="4"/>
    </g>
    <g text-anchor="middle" fill="#20343e" font-size="20" font-weight="700">
      <text x="110" y="120">Read</text>
      <text x="295" y="120">Generate</text>
      <text x="480" y="120">Check</text>
      <text x="665" y="120">Run</text>
      <text x="850" y="120">Submit</text>
    </g>
    <g text-anchor="middle" fill="#52646d" font-size="14">
      <text x="110" y="151">Problem + template</text>
      <text x="295" y="151">Create / restore</text>
      <text x="480" y="151">Syntax + interface</text>
      <text x="665" y="151">Site examples</text>
      <text x="850" y="151">Judge by ID</text>
    </g>
    <g fill="none" stroke="#61747e" stroke-width="2" marker-end="url(#arrow)">
      <path d="M191 128H213"/>
      <path d="M376 128H398"/>
      <path d="M561 128H583"/>
      <path d="M746 128H768"/>
    </g>

    <path d="M850 180V224H170" fill="none" stroke="#61747e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="none" stroke="#61747e" stroke-width="2" marker-end="url(#arrow)">
      <path d="M170 224V254"/>
      <path d="M480 224V254"/>
      <path d="M790 224V254"/>
    </g>

    <rect x="35" y="262" width="270" height="94" rx="6" fill="#f2faf6" stroke="#b7d9c7"/>
    <rect x="345" y="262" width="270" height="94" rx="6" fill="#fff8ed" stroke="#e8d1a6"/>
    <rect x="655" y="262" width="270" height="94" rx="6" fill="#fdf5f2" stroke="#e5c4b9"/>
    <g text-anchor="middle" font-weight="700" font-size="20">
      <text x="170" y="303" fill="#1f7650">Accepted</text>
      <text x="480" y="303" fill="#9b661a">Failed</text>
      <text x="790" y="303" fill="#a44e3b">Unconfirmed</text>
    </g>
    <g text-anchor="middle" fill="#40555e" font-size="15">
      <text x="170" y="331">Advance to the next problem</text>
      <text x="480" y="331">Save feedback and repair</text>
      <text x="790" y="331">Stop and preserve progress</text>
    </g>
    <text x="35" y="380" fill="#60717a" font-size="13">Recheck repairs. Do not resubmit while submission ownership is unresolved.</text>
  </g>
</svg>
