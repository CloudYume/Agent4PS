<svg xmlns="http://www.w3.org/2000/svg" width="960" height="252" viewBox="0 0 960 252" role="img" aria-labelledby="title description">
  <title id="title">Agent4PS 系统边界</title>
  <desc id="description">LeetCode 页面与 Edge 扩展交互。扩展通过本机配对桥接服务与 Python Agent 通信；Orchestrator 协调模型、本地校验和进度存储。</desc>
