      <path d="M1 1L9 5L1 9" fill="none" stroke="#58717c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="250" rx="6" fill="#fbfcfd" stroke="#dce5e8"/>
  <g font-family="Inter, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
    <text x="36" y="39" fill="#52646d" font-size="15" font-weight="700">站点</text>
